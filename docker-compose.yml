services:
  postgres:
    image: postgres:16-alpine
    container_name: skybook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: skybook
      POSTGRES_PASSWORD: skybook_dev_pass
      POSTGRES_DB: skybook
    ports:
      - "5432:5432"
    volumes:
      - skybook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skybook -d skybook"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: skybook-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - skybook_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skybook_pgdata:
  skybook_redisdata: